
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Visor 3D Interactivo</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js">
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
    }

    model-viewer {
      width: 100%;
      height: 100dvh;
      background: #ffffff;
    }

    .ar-button {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      padding: 14px 24px;
      border: none;
      border-radius: 30px;
      background: #111111;
      color: white;
      font: bold 14px Arial, sans-serif;
      cursor: pointer;
    }

    .ar-button[hidden] {
      display: none;
    }
  </style>
</head>

<body>

  <model-viewer
    id="visor"
    src="./modelo.glb"
    alt="Modelo 3D animado e interactivo"
    camera-controls
    autoplay
    auto-rotate
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-placement="floor"
    ar-scale="auto"
    shadow-intensity="1"
    exposure="1"
    interaction-prompt="none">

    <button
      id="ar-button"
      slot="ar-button"
      class="ar-button"
      hidden>
      Ver en realidad aumentada
    </button>

  </model-viewer>

  <script>
    const visor = document.querySelector("#visor");
    const arButton = document.querySelector("#ar-button");

    visor.addEventListener("load", () => {

      // Reproducir animación infinitamente
      if (visor.availableAnimations.length > 0) {
        visor.play({
          repetitions: Infinity
        });
      }

      // Mostrar botón AR si está disponible
      arButton.hidden = !visor.canActivateAR;
    });
  </script>

</body>
</html>
